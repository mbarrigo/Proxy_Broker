[workspace]
resolver = "2"
members = [
    "crates/ipc",
    "crates/peer-identity",
    "crates/secret-store",
    "crates/policy",
    "crates/credential-manager",
    "crates/adapter-ssh",
    "crates/adapter-totp",
    "crates/adapter-github",
    "crates/http-relay",
    "crates/audit",
    "crates/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
