[workspace]
resolver = "2"
members = [
    "crates/broker-ipc",
    "crates/broker-identity",
    "crates/broker-storage",
    "crates/broker-policy",
    "crates/broker-core",
    "crates/broker-audit",
    "crates/broker-http-relay",
    "providers/ssh",
    "providers/totp",
    "providers/github",
    "daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
